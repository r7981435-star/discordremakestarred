plugins {
    id 'java'
    id 'application'
}

group = 'com.notdonutsmp'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.notdonutsmp.Main'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.notdonutsmp.Main',
            'Implementation-Title': 'Not Donut SMP Desktop Launcher',
            'Implementation-Version': project.version
        )
    }
}
